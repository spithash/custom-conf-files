# General settings
set -g history-limit 15000
set -g allow-rename off
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -s set-clipboard external
set -sg escape-time 10
set -sg repeat-time 600
set -s focus-events on

# Mouse and vi copy mode
set -g mouse on
set -g mode-keys vi
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Prefix and pane movement
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Status bar
set -g display-time 2500
set -g status on
set -g status-interval 10
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour232 fg=colour82"
set -g status-left-length 48
set -g status-right-length 120
set -g status-left "#[fg=colour46,bold] #H #[fg=colour82]│ #[fg=brightmagenta]#S #[default]"
set -g status-right "#(~/.tmux-status) "
set -g message-style "bg=black fg=terminal"
set -g mode-style "bg=colour22,fg=colour120,bold"
set -g status-keys emacs

# Window list
set -g window-status-separator "  "
set -g window-status-style "fg=colour82"
set -g window-status-format "#{window_index}#{?window_flags,#{window_flags},} #{window_name}"
set -g window-status-current-style "fg=colour16,bg=colour46"
set -g window-status-current-format "#{window_index}#{?window_flags,#{window_flags},} #{window_name}"
set -g window-status-activity-style "fg=colour226,bold"
set -g window-status-bell-style "fg=colour196,bold"
set -g window-status-last-style "fg=colour214,bold"

# List of plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'


if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'

# General settings
set -g history-limit 15000
set -g allow-rename off
set -g default-terminal "tmux-256color"
# A fixed array slot makes this safe to reload repeatedly.
set -s terminal-features[100] 'xterm*:RGB'
set -s set-clipboard external
# Allow fragmented escape sequences time to arrive over SSH.
set -s escape-time 100
set -sg repeat-time 600
set -s focus-events on

# Mouse and vi copy mode
set -g mouse on
set -g mode-keys vi
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Prefix and pane movement
set -g prefix C-a
unbind C-b
bind C-a send-prefix
# Create windows and splits in the active pane's directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# Read local alerts with NeoMutt.
bind m new-window -n mail '/usr/bin/neomutt -f "/var/mail/$USER"'

# Status bar
set -g display-time 2500
set -g status on
set -g status-interval 10
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=green,fg=colour16"
set -g status-left-length 48
set -g status-right-length 140
set -g status-left "#[fg=colour231,bg=colour24,bold] #H #[default] │ #[fg=colour231,bg=colour90,bold] #S #[default] "
# Embedded status scripts; no external helper files are needed.
set -g @mail-script 'mailbox=${TMUX_MAILBOX:-/var/mail/$(id -un)}'"\n"\
'if [ ! -e "$mailbox" ]; then'"\n"\
'    count=0'"\n"\
'elif [ ! -r "$mailbox" ]; then'"\n"\
'    count='"'"'?'"'"''"\n"\
'else'"\n"\
'    count=$(awk '"'"''"\n"\
'        /^From / {'"\n"\
'            if (message && !seen) unread++'"\n"\
'            message=1; headers=1; seen=0'"\n"\
'            next'"\n"\
'        }'"\n"\
'        headers && /^Status:/ && /R/ {seen=1}'"\n"\
'        /^\r?$/ {headers=0}'"\n"\
'        END {'"\n"\
'            if (message && !seen) unread++'"\n"\
'            printf "%d", unread'"\n"\
'        }'"\n"\
'    '"'"' "$mailbox" 2>/dev/null) || count='"'"'?'"'"''"\n"\
'fi'"\n"\
'if [ "$count" = 0 ]; then'"\n"\
'    printf '"'"'#[fg=colour120,bg=colour22] MAIL 0 #[default]'"'"''"\n"\
'else'"\n"\
'    printf '"'"'#[fg=colour231,bg=colour124,bold] MAIL %s #[default]'"'"' "$count"'"\n"\
'fi'

set -g @status-script 'if [ -r /proc/loadavg ]; then'"\n"\
'    read -r load1 load5 load15 _ < /proc/loadavg'"\n"\
'    cpus=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 1)'"\n"\
'    memory=$(awk '"'"'/MemTotal:/ {t=$2} /MemAvailable:/ {a=$2} END {if(t>0) printf "%.0f%%", 100*(t-a)/t}'"'"' /proc/meminfo)'"\n"\
'elif command -v sysctl >/dev/null 2>&1; then'"\n"\
'    set -- $(sysctl -n vm.loadavg 2>/dev/null | tr -d '"'"'{}'"'"')'"\n"\
'    load1=${1:-0}; load5=${2:-0}; load15=${3:-0}'"\n"\
'    cpus=$(sysctl -n hw.ncpu 2>/dev/null || echo 1)'"\n"\
'    if command -v vm_stat >/dev/null 2>&1; then'"\n"\
'        memory=$(vm_stat 2>/dev/null | awk '"'"'/Pages free/ {f=$3} /Pages inactive/ {i=$3} /Pages speculative/ {s=$3} /Pages wired down/ {w=$4} END {if(f+i+s+w>0) printf "%.0f%%", 100*w/(f+i+s+w)}'"'"')'"\n"\
'    fi'"\n"\
'else'"\n"\
'    load1=0; load5=0; load15=0; cpus=1'"\n"\
'fi'"\n"\
'load1=${load1:-0}; load5=${load5:-0}; load15=${load15:-0}; cpus=${cpus:-1}'"\n"\
'awk -v a="$load1" -v b="$load5" -v c="$load15" -v n="$cpus" -v m="$memory" '"'"'BEGIN {'"\n"\
'    if (n < 1) n=1'"\n"\
'    r=a/n'"\n"\
'    style=r>=0.8 ? "fg=colour231,bg=colour124,bold" : r>=0.5 ? "fg=colour16,bg=colour220,bold" : "fg=colour120,bg=colour22"'"\n"\
'    printf "#[default]#[fg=colour231,bg=colour24,bold] LOAD #[nobold]#[%s] %.2f %.2f %.2f #[fg=colour231,bg=colour24] /%.0f CPU #[default]", style,a,b,c,n'"\n"\
'    if (m != "") {'"\n"\
'        memstyle=(m+0)>=80 ? "fg=colour231,bg=colour124,bold" : (m+0)>=50 ? "fg=colour16,bg=colour220,bold" : "fg=colour120,bg=colour22"'"\n"\
'        printf " │ #[fg=colour231,bg=colour90,bold] MEM #[nobold]#[%s] %s #[default]",memstyle,m'"\n"\
'    }'"\n"\
'    printf " │ #[fg=colour231,bg=colour24] "'"\n"\
'}'"'"''"\n"\
'date '"'"'+%a %d %b  %H:%M'"'"''

set -g status-right '#(#{@mail-script}) │ #(#{@status-script}) '
set -g message-style "bg=colour22,fg=colour231"
set -g message-command-style "bg=colour22,fg=colour231"
set -g mode-style "bg=colour22,fg=colour120,bold"
set -g status-keys emacs

# Window list
set -g window-status-separator "  "
set -g window-status-style "fg=colour16,bg=green,nobold"
set -g window-status-format "#{window_index}#{?window_flags,#{window_flags},} #{window_name}"
set -g window-status-current-style "fg=colour231,bg=colour22,bold"
set -g window-status-current-format " #{window_index}#{?window_flags,#{window_flags},} #{window_name} "
set -g window-status-activity-style "fg=colour16,bg=colour220,bold"
set -g window-status-bell-style "fg=colour231,bg=colour124,bold"
set -g window-status-last-style "fg=colour231,bg=colour24,bold"

# List of plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'


if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'

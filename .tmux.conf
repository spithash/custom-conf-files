# General settings
set -g history-limit 15000
set -g allow-rename off
set -g default-terminal "tmux-256color"
# A fixed array slot makes this safe to reload repeatedly.
set -s terminal-features[100] 'xterm*:RGB'
set -s set-clipboard external
# Allow fragmented escape sequences time to arrive over SSH.
set -s escape-time 100
set -sg repeat-time 600
set -s focus-events on

# Mouse and vi copy mode
set -g mouse on
set -g mode-keys vi
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-vi C-WheelDownPane send-keys -X halfpage-down
bind -T copy-mode-emacs C-WheelUpPane send-keys -X halfpage-up
bind -T copy-mode-emacs C-WheelDownPane send-keys -X halfpage-down

# Prefix and pane movement
set -g prefix C-a
unbind C-b
bind C-a send-prefix
# Create windows and splits in the active pane's directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:" "join-pane -t '%%'"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# Read local alerts with NeoMutt.
bind m new-window -n mail '/usr/bin/neomutt -f "/var/mail/$USER"'

# Status bar
set -g display-time 2500
set -g status on
set -g status-interval 10
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=green,fg=colour16"
set -g status-left-length 48
set -g status-right-length 140
set -g status-left "#[fg=colour231,bg=colour24,bold] #H #[default] │ #[fg=colour231,bg=colour90,bold] #S #[default] "
set -g status-right "#(sh ~/.tmux-mail) │ #(~/.tmux-status) "
set -g message-style "bg=colour22,fg=colour231"
set -g message-command-style "bg=colour22,fg=colour231"
set -g mode-style "bg=colour22,fg=colour120,bold"
set -g status-keys emacs

# Window list
set -g window-status-separator "  "
set -g window-status-style "fg=colour16,bg=green,nobold"
set -g window-status-format "#{window_index}#{?window_flags,#{window_flags},} #{window_name}"
set -g window-status-current-style "fg=colour231,bg=colour22,bold"
set -g window-status-current-format " #{window_index}#{?window_flags,#{window_flags},} #{window_name} "
set -g window-status-activity-style "fg=colour16,bg=colour220,bold"
set -g window-status-bell-style "fg=colour231,bg=colour124,bold"
set -g window-status-last-style "fg=colour231,bg=colour24,bold"

# List of plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'


if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
